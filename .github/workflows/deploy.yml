name: Build and Deploy to Production Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Grant GITHUB_TOKEN write permissions to push to the production branch
permissions:
  contents: write

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Main Branch
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Static Site
        run: npm run build

      - name: 🚀 Push Build Artifacts to Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # Target production branch (only contains dist files)
          folder: dist     # Folder to push to the branch
          clean: true      # Automatically remove obsolete files from production branch

